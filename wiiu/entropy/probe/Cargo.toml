[package]
name = "horizon-wiiu-entropy-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[target.'cfg(target_os = "cafe")'.dependencies]
horizon-wiiu-entropy = { path = ".." }
getrandom02 = { package = "getrandom", version = "=0.2.17" }
getrandom03 = { package = "getrandom", version = "=0.3.4" }
getrandom04 = { package = "getrandom", version = "=0.4.3" }

[patch.crates-io]
getrandom = { path = "../../../third_party/getrandom-0.4.3" }

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("cafe"))'] }
