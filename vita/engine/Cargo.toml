[package]
name = "horizon-vita-engine"
version = "0.0.5"
edition = "2021"
license = "MIT"
publish = false
description = "Horizon Vita: one PS Vita app with the menu, diagnostics, mod folders and the GXM 3D renderer bring-up. Not the game yet."

[dependencies]
horizon-core = { path = "../../crates/horizon-core" }
glam = "0.30"

[target.'cfg(target_os = "vita")'.dependencies]
vitasdk-sys = { version = "0.3.3", features = ["SceGxm_stub", "SceDisplay_stub", "SceSysmem_stub", "SceCtrl_stub", "SceTouch_stub"] }

[package.metadata.vita]
title_id = "HRZN00001"
title_name = "Horizon Vita"
assets = "./static"

[profile.release]
panic = "abort"
lto = true
opt-level = 3

# Kept out of the Horizon workspace: it builds for the Vita target with build-std.
[workspace]
