[package]
name = "horizon-vita-world-tools"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
description = "PC tools for the PS Vita port: measure Horizon's terrain start-up, pack a real Horizon world region for the console to draw, and preview a pack"

[features]
# Measure Horizon's reduced generator, as the console builds it.
terrain-only = ["horizon-vita-world/terrain-only"]

[dependencies]
horizon-vita-world = { path = "../world" }
png = "0.18"
glam = "0.30"

[profile.release]
opt-level = 3

# Kept out of the Horizon workspace, like the other vita/ crates.
[workspace]
